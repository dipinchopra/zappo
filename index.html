<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Indian House Mosquito Zapper 3D</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #05050a; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            user-select: none; 
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: calc(100vh * (9 / 16));
            max-height: calc(100vw * (16 / 9));
            aspect-ratio: 9 / 16;
            background: #000;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.25);
            overflow: hidden;
            border-radius: 8px;
        }

        #ui {
            position: absolute; top: 20px; left: 20px;
            font-size: 28px; font-weight: 800; color: #00f0ff;
            text-shadow: 0 0 10px rgba(0,240,255,0.8), 2px 2px 4px #000;
            z-index: 100; pointer-events: none; letter-spacing: 1px;
        }

        #alert {
            position: absolute; top: 60px; left: 20px;
            font-size: 14px; font-weight: 700; color: #ff3366;
            text-shadow: 0 0 8px rgba(255,51,102,0.8);
            z-index: 100; pointer-events: none; display: none;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            cursor: none;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="game-container">
        <div id="ui">ZAPS: <span id="score">0</span></div>
        <div id="alert">⚠️ FLEE MODE ACTIVE (>15 ZAPS)</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const container = document.getElementById('game-container');

        // 1. Scene & Camera Setup
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x201a15, 0.03);

        const camera = new THREE.PerspectiveCamera(60, 9 / 16, 0.1, 100);
        camera.position.set(0, 0, 8.5);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(container.clientWidth, container.clientHeight), 0.8, 0.4, 0.3));

        // 2. Lighting Setup
        scene.add(new THREE.AmbientLight(0xffedd8, 0.7));

        const tubeLight = new THREE.PointLight(0xffffff, 2.2, 20);
        tubeLight.position.set(0, 6, 4);
        tubeLight.castShadow = true;
        scene.add(tubeLight);

        const zapLight = new THREE.PointLight(0x00f0ff, 0, 8);
        scene.add(zapLight);

        // 3. Indian Household Background Environment
        const wall = new THREE.Mesh(
            new THREE.PlaneGeometry(12, 22),
            new THREE.MeshStandardMaterial({ color: 0xded2be, roughness: 0.8 })
        );
        wall.position.z = -3;
        wall.receiveShadow = true;
        scene.add(wall);

        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(12, 10),
            new THREE.MeshStandardMaterial({ color: 0xc8bcab, roughness: 0.3, metalness: 0.1 })
        );
        floor.rotation.x = -Math.PI / 2.5;
        floor.position.set(0, -6.5, -0.5);
        floor.receiveShadow = true;
        scene.add(floor);

        // Switchboard
        const switchboardGroup = new THREE.Group();
        switchboardGroup.add(new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.08), new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.2 })));
        for(let i = -0.4; i <= 0.4; i += 0.2) {
            const sw = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.15, 0.04), new THREE.MeshStandardMaterial({ color: 0x333333 }));
            sw.position.set(i, 0.1, 0.05);
            switchboardGroup.add(sw);
        }
        const redLed = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
        redLed.position.set(0.4, -0.2, 0.05);
        switchboardGroup.add(redLed);
        switchboardGroup.position.set(-2.5, 1.5, -2.9);
        scene.add(switchboardGroup);

        // Wall Clock
        const clockGroup = new THREE.Group();
        clockGroup.add(new THREE.Mesh(new THREE.TorusGeometry(0.7, 0.06, 16, 32), new THREE.MeshStandardMaterial({ color: 0x8b0000, roughness: 0.3 })));
        clockGroup.add(new THREE.Mesh(new THREE.CircleGeometry(0.7, 32), new THREE.MeshBasicMaterial({ color: 0xffffff })));
        clockGroup.position.set(2.0, 3.5, -2.9);
        scene.add(clockGroup);

        // 4. Upgraded Racquet Model with Holding Hand
        function createRacquetWithHand() {
            const group = new THREE.Group();

            // Oval Frame
            const frameMat = new THREE.MeshPhysicalMaterial({ color: 0x0088ff, roughness: 0.15, clearcoat: 0.9 });
            const frame = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.08, 16, 48), frameMat);
            frame.scale.set(1.0, 1.3, 1.0); // Realistic Oval shape
            frame.castShadow = true;
            group.add(frame);

            // Wire Grid Net
            const net = new THREE.Mesh(
                new THREE.CircleGeometry(0.95, 24),
                new THREE.MeshBasicMaterial({ color: 0x88ffff, wireframe: true, transparent: true, opacity: 0.35 })
            );
            net.scale.set(1.0, 1.3, 1.0);
            group.add(net);

            // Handle
            const handle = new THREE.Mesh(
                new THREE.CylinderGeometry(0.12, 0.14, 1.8, 16),
                new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.7 })
            );
            handle.position.y = -1.8;
            handle.castShadow = true;
            group.add(handle);

            // Power Indicator LED on handle
            const pwrLed = new THREE.Mesh(new THREE.SphereGeometry(0.025, 8, 8), new THREE.MeshBasicMaterial({ color: 0x00ff00 }));
            pwrLed.position.set(0, -1.2, 0.13);
            group.add(pwrLed);

            // 3D Holding Hand Model
            const handGroup = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xd2a379, roughness: 0.6 });

            // Palm / Fist
            const palm = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.45, 0.35), skinMat);
            palm.position.set(0.04, -1.8, 0.05);
            handGroup.add(palm);

            // Wrapped Fingers
            for(let i = 0; i < 4; i++) {
                const finger = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.32), skinMat);
                finger.rotation.x = Math.PI / 2;
                finger.position.set(-0.06, -1.65 - (i * 0.1), 0.1);
                handGroup.add(finger);
            }

            // Thumb
            const thumb = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.28), skinMat);
            thumb.rotation.z = -Math.PI / 4;
            thumb.position.set(0.1, -1.6, 0.12);
            handGroup.add(thumb);

            // Forearm (stretching down offscreen)
            const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 2.5), skinMat);
            arm.position.set(0.08, -3.1, 0.05);
            handGroup.add(arm);

            group.add(handGroup);
            return group;
        }

        const racquet = createRacquetWithHand();
        scene.add(racquet);

        // 5. Realistic Micro Mosquito
        function createRealisticMosquito() {
            const bug = new THREE.Group();

            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x221100, roughness: 0.8 });
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const wingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.5, side: THREE.DoubleSide });

            const abdomen = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.3, 6), bodyMat);
            abdomen.rotation.x = Math.PI / 2.3;
            abdomen.position.set(0, -0.03, -0.15);
            bug.add(abdomen);

            const thorax = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), bodyMat);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.03, 6, 6), bodyMat);
            head.position.set(0, 0.02, 0.07);
            
            const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.012, 6, 6), eyeMat); eyeL.position.set(-0.02, 0.03, 0.08);
            const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.012, 6, 6), eyeMat); eyeR.position.set(0.02, 0.03, 0.08);
            bug.add(thorax, head, eyeL, eyeR);

            const needle = new THREE.Mesh(new THREE.CylinderGeometry(0.002, 0.001, 0.2), bodyMat);
            needle.rotation.x = Math.PI / 2.6;
            needle.position.set(0, -0.02, 0.16);
            bug.add(needle);

            const legMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            for(let i = 0; i < 6; i++) {
                const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.002, 0.002, 0.2), legMat);
                leg.position.set(i % 2 === 0 ? -0.05 : 0.05, -0.08, (Math.floor(i / 2) - 1) * 0.05);
                leg.rotation.z = (i % 2 === 0 ? -1 : 1) * 0.6;
                bug.add(leg);
            }

            const wingGeo = new THREE.PlaneGeometry(0.25, 0.08);
            const wingL = new THREE.Mesh(wingGeo, wingMat); wingL.position.set(-0.12, 0.06, 0);
            const wingR = new THREE.Mesh(wingGeo, wingMat); wingR.position.set(0.12, 0.06, 0);
            bug.add(wingL, wingR);

            bug.scale.setScalar(0.45);
            return { mesh: bug, wingL, wingR };
        }

        // 6. Spawner
        const bugsGroup = new THREE.Group();
        scene.add(bugsGroup);

        function spawnMosquito() {
            const { mesh, wingL, wingR } = createRealisticMosquito();
            mesh.position.set(
                (Math.random() - 0.5) * 5,
                (Math.random() - 0.5) * 7,
                (Math.random() - 0.5) * 2 + 1
            );
            mesh.userData = { wingL, wingR, phase: Math.random() * 100 };
            bugsGroup.add(mesh);
        }

        for (let i = 0; i < 8; i++) spawnMosquito();
        setInterval(() => { if (bugsGroup.children.length < 12) spawnMosquito(); }, 1200);

        // 7. Satisfying & Softer Audio Engine
        let audioCtx;
        function playSatisfyingZap() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const t = audioCtx.currentTime;

            // Master Volume (Quieter)
            const masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0.25, t); 
            masterGain.connect(audioCtx.destination);

            // Noise Crackle Burst
            const bufferSize = audioCtx.sampleRate * 0.04; 
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }
            
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'highpass';
            noiseFilter.frequency.setValueAtTime(1000, t);

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.8, t);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.04);

            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(masterGain);

            // Punchy Sub Pop
            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(320, t);
            osc.frequency.exponentialRampToValueAtTime(40, t + 0.05);

            oscGain.gain.setValueAtTime(0.9, t);
            oscGain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);

            osc.connect(oscGain);
            oscGain.connect(masterGain);

            noise.start(t);
            osc.start(t);
            osc.stop(t + 0.05);
        }

        function createSparkVFX(pos) {
            const count = 25;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const vels = [];

            for (let i = 0; i < count; i++) {
                positions[i * 3] = pos.x; positions[i * 3 + 1] = pos.y; positions[i * 3 + 2] = pos.z;
                vels.push((Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.3);
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ color: 0x00ffff, size: 0.15, transparent: true, blending: THREE.AdditiveBlending });
            const pSystem = new THREE.Points(geo, mat);
            scene.add(pSystem);

            let frame = 0;
            function animSparks() {
                frame++;
                const p = pSystem.geometry.attributes.position.array;
                for (let i = 0; i < count; i++) {
                    p[i*3] += vels[i*3]; p[i*3+1] += vels[i*3+1]; p[i*3+2] += vels[i*3+2];
                }
                pSystem.geometry.attributes.position.needsUpdate = true;
                mat.opacity -= 0.05;
                if (frame < 20) requestAnimationFrame(animSparks);
                else scene.remove(pSystem);
            }
            animSparks();
        }

        // 8. Pointer Tracking
        const mouse = new THREE.Vector2();
        let score = 0;
        const scoreUI = document.getElementById('score');
        const alertUI = document.getElementById('alert');

        function updatePointer(clientX, clientY) {
            const rect = container.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            mouse.x = (x / rect.width) * 2 - 1;
            mouse.y = -(y / rect.height) * 2 + 1;

            const vector = new THREE.Vector3(mouse.x, mouse.y, 0.5).unproject(camera);
            const dir = vector.sub(camera.position).normalize();
            const dist = -camera.position.z / dir.z;
            const pos = camera.position.clone().add(dir.multiplyScalar(dist));

            racquet.position.copy(pos);
            racquet.rotation.y = mouse.x * 0.25;
            racquet.rotation.x = -mouse.y * 0.25;
            zapLight.position.copy(pos);
        }

        window.addEventListener('mousemove', (e) => updatePointer(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) updatePointer(e.touches[0].clientX, e.touches[0].clientY);
        });

        // 9. Main Loop (Fixed Hitbox & AI Logic)
        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.003;
            const racquetPos = racquet.position;

            if (score >= 15) { alertUI.style.display = 'block'; }

            for (let i = bugsGroup.children.length - 1; i >= 0; i--) {
                const bug = bugsGroup.children[i];

                // FIXED HITBOX: Oval 2D distance calculation + generous Z-depth threshold
                const dx = bug.position.x - racquetPos.x;
                const dy = (bug.position.y - racquetPos.y) / 1.3; // Match oval height ratio
                const dz = Math.abs(bug.position.z - racquetPos.z);
                const dist2D = Math.sqrt(dx * dx + dy * dy);

                if (dist2D < 1.15 && dz < 1.2) {
                    createSparkVFX(bug.position);
                    playSatisfyingZap();

                    zapLight.intensity = 8;
                    setTimeout(() => zapLight.intensity = 0, 80);

                    bugsGroup.remove(bug);
                    score++;
                    scoreUI.innerText = score;
                    continue;
                }

                // Fleeing Logic (>15 Zaps)
                if (score >= 15) {
                    const fleeVec = bug.position.clone().sub(racquetPos);
                    if (fleeVec.length() < 3.5) {
                        fleeVec.normalize();
                        bug.position.addScaledVector(fleeVec, 0.1); 
                        bug.position.x += (Math.random() - 0.5) * 0.06;
                        bug.position.y += (Math.random() - 0.5) * 0.06;
                    } else {
                        bug.position.x += Math.sin(time * 2 + bug.userData.phase) * 0.03;
                        bug.position.y += Math.cos(time * 2 + bug.userData.phase) * 0.03;
                    }
                } else {
                    bug.position.x += Math.sin(time + bug.userData.phase) * 0.015;
                    bug.position.y += Math.cos(time * 0.8 + bug.userData.phase) * 0.015;
                }

                bug.userData.wingL.rotation.y = Math.sin(Date.now() * 0.18) * 0.9;
                bug.userData.wingR.rotation.y = -Math.sin(Date.now() * 0.18) * 0.9;
            }

            composer.render();
        }
        animate();
    </script>
</body>
</html>
