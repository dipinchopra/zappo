<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Indian House Mosquito Zapper 3D</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #05050a; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            user-select: none; 
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: calc(100vh * (9 / 16));
            max-height: calc(100vw * (16 / 9));
            aspect-ratio: 9 / 16;
            background: #000;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.25);
            overflow: hidden;
            border-radius: 8px;
        }

        #ui {
            position: absolute; top: 20px; left: 20px;
            font-size: 28px; font-weight: 800; color: #00f0ff;
            text-shadow: 0 0 10px rgba(0,240,255,0.8), 2px 2px 4px #000;
            z-index: 100; pointer-events: none; letter-spacing: 1px;
        }

        #hint {
            position: absolute; bottom: 20px; width: 100%;
            text-align: center; font-size: 14px; font-weight: 700; color: #ffffff;
            text-shadow: 0 0 8px rgba(0,240,255,0.8), 1px 1px 3px #000;
            z-index: 100; pointer-events: none; opacity: 0.85;
        }

        #alert {
            position: absolute; top: 60px; left: 20px;
            font-size: 14px; font-weight: 700; color: #ff3366;
            text-shadow: 0 0 8px rgba(255,51,102,0.8);
            z-index: 100; pointer-events: none; display: none;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            cursor: none;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="game-container">
        <div id="ui">ZAPS: <span id="score">0</span></div>
        <div id="alert">⚠️ FLEE MODE ACTIVE (>15 ZAPS)</div>
        <div id="hint">HOLD TO CHARGE ⚡ RELEASE TO ZAP MULTIPLE</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const container = document.getElementById('game-container');

        // 1. Scene & Camera
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x1a1510, 0.025);

        const camera = new THREE.PerspectiveCamera(60, 9 / 16, 0.1, 100);
        camera.position.set(0, 0, 8.5);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(container.clientWidth, container.clientHeight), 0.8, 0.4, 0.3));

        // 2. Room Lighting
        scene.add(new THREE.AmbientLight(0xffedd8, 0.75));

        const tubeLight = new THREE.PointLight(0xfffaed, 2.5, 22);
        tubeLight.position.set(-2, 5, 4);
        tubeLight.castShadow = true;
        scene.add(tubeLight);

        const handLight = new THREE.PointLight(0xffe0c0, 1.2, 6);
        scene.add(handLight);

        const zapLight = new THREE.PointLight(0x00f0ff, 0, 10);
        scene.add(zapLight);

        // 3. Environment (Wall, Window, Table, Props)
        const wall = new THREE.Mesh(
            new THREE.PlaneGeometry(14, 22),
            new THREE.MeshStandardMaterial({ color: 0x6bb3c4, roughness: 0.7 })
        );
        wall.position.z = -3;
        wall.receiveShadow = true;
        scene.add(wall);

        // Window
        const windowGroup = new THREE.Group();
        const skyBackdrop = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 3.4), new THREE.MeshBasicMaterial({ color: 0x050a18 }));
        skyBackdrop.position.z = -3.05;
        windowGroup.add(skyBackdrop);

        const moon = new THREE.Mesh(new THREE.CircleGeometry(0.3, 16), new THREE.MeshBasicMaterial({ color: 0xfffae0 }));
        moon.position.set(0.6, 0.9, -3.02);
        windowGroup.add(moon);

        const winFrameMat = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.6 });
        const winOuter = new THREE.Mesh(new THREE.BoxGeometry(2.6, 3.6, 0.15), winFrameMat);
        winOuter.position.z = -2.95;
        windowGroup.add(winOuter);

        const shutter = new THREE.Mesh(new THREE.BoxGeometry(1.2, 3.4, 0.08), winFrameMat);
        shutter.position.set(1.8, 0, -2.6);
        shutter.rotation.y = -Math.PI / 3;
        windowGroup.add(shutter);

        for(let x = -0.8; x <= 0.8; x += 0.4) {
            const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 3.4), new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8 }));
            bar.position.set(x, 0, -2.9);
            windowGroup.add(bar);
        }
        windowGroup.position.set(1.6, 2.2, 0);
        scene.add(windowGroup);

        // Table & Bottom Items
        const tableMat = new THREE.MeshStandardMaterial({ color: 0x4a2a18, roughness: 0.4 });
        const tableTop = new THREE.Mesh(new THREE.BoxGeometry(12, 1.8, 4), tableMat);
        tableTop.position.set(0, -4.8, -1.0);
        tableTop.receiveShadow = true;
        scene.add(tableTop);

        // Radio & Vase
        const radioGroup = new THREE.Group();
        radioGroup.add(new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.9, 0.6), new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 })));
        const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 1.4), new THREE.MeshStandardMaterial({ metalness: 0.9 }));
        antenna.rotation.z = -Math.PI / 4; antenna.position.set(-0.6, 0.8, -0.1);
        radioGroup.add(antenna);
        radioGroup.position.set(-1.8, -3.4, -0.8);
        scene.add(radioGroup);

        const vaseGroup = new THREE.Group();
        vaseGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.45, 1.0, 16), new THREE.MeshStandardMaterial({ color: 0xbf532c, roughness: 0.6 })));
        vaseGroup.position.set(2.0, -3.4, -0.8);
        scene.add(vaseGroup);

        // 4. Racquet Net Texture Generator
        function createLightningNetTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, 512, 512);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.lineWidth = 1.5;
            for (let i = 0; i <= 512; i += 12) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
            }

            ctx.strokeStyle = '#ffffff'; ctx.fillStyle = '#ffffff'; ctx.lineWidth = 8;
            ctx.beginPath(); ctx.ellipse(256, 256, 115, 145, 0, 0, Math.PI * 2); ctx.stroke();

            for (let i = 0; i < 8; i++) {
                const angle = (i * Math.PI * 2) / 8;
                ctx.beginPath();
                ctx.moveTo(256 + Math.cos(angle) * 115, 256 + Math.sin(angle) * 145);
                ctx.lineTo(256 + Math.cos(angle) * 230, 256 + Math.sin(angle) * 250);
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.moveTo(275, 130); ctx.lineTo(215, 250); ctx.lineTo(260, 250);
            ctx.lineTo(235, 380); ctx.lineTo(300, 240); ctx.lineTo(255, 240);
            ctx.closePath(); ctx.fill();

            return new THREE.CanvasTexture(canvas);
        }

        const netTexture = createLightningNetTexture();

        // 5. Racquet & Hand
        let netMesh;
        function createRacquetWithHand() {
            const group = new THREE.Group();

            const frameMat = new THREE.MeshPhysicalMaterial({ color: 0x3fbac2, roughness: 0.2, clearcoat: 0.8 });
            const frame = new THREE.Mesh(new THREE.TorusGeometry(1.05, 0.08, 16, 48), frameMat);
            frame.scale.set(1.0, 1.35, 1.0);
            group.add(frame);

            const netMat = new THREE.MeshBasicMaterial({ map: netTexture, transparent: true, opacity: 0.85, side: THREE.DoubleSide });
            netMesh = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 2.6), netMat);
            group.add(netMesh);

            const handleMain = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.4, 16), new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.3 }));
            handleMain.position.y = -2.5;
            group.add(handleMain);

            // Hand
            const handGroup = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xd99a6c, roughness: 0.5 });

            const palm = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.5, 0.42), skinMat);
            palm.position.set(0.02, -2.5, 0.05);
            handGroup.add(palm);

            for(let i = 0; i < 4; i++) {
                const finger = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.42), skinMat);
                finger.rotation.x = Math.PI / 2.2; finger.rotation.y = -0.2;
                finger.position.set(-0.1, -2.3 - (i * 0.12), 0.15);
                handGroup.add(finger);
            }

            const thumb = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, 0.38), skinMat);
            thumb.rotation.z = -Math.PI / 3.5; thumb.position.set(0.16, -2.25, 0.18);
            handGroup.add(thumb);

            const forearm = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.26, 3.2), skinMat);
            forearm.position.set(0.08, -4.0, 0.02);
            handGroup.add(forearm);

            group.add(handGroup);

            // High Render Order ensures Racquet is ALWAYS rendered over mosquitoes
            group.traverse(child => { child.renderOrder = 100; });

            return group;
        }

        const racquet = createRacquetWithHand();
        scene.add(racquet);

        // 6. Mosquitoes (Rendered strictly behind racquet)
        const bugsGroup = new THREE.Group();
        bugsGroup.renderOrder = 1;
        scene.add(bugsGroup);

        function createRealisticMosquito() {
            const bug = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1f1105, roughness: 0.8 });
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const wingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.5, side: THREE.DoubleSide });

            const abdomen = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.3, 6), bodyMat);
            abdomen.rotation.x = Math.PI / 2.3; abdomen.position.set(0, -0.03, -0.15);
            bug.add(abdomen);

            const thorax = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), bodyMat);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.03, 6, 6), bodyMat);
            head.position.set(0, 0.02, 0.07);
            
            const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.012, 6, 6), eyeMat); eyeL.position.set(-0.02, 0.03, 0.08);
            const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.012, 6, 6), eyeMat); eyeR.position.set(0.02, 0.03, 0.08);
            bug.add(thorax, head, eyeL, eyeR);

            const wingGeo = new THREE.PlaneGeometry(0.25, 0.08);
            const wingL = new THREE.Mesh(wingGeo, wingMat); wingL.position.set(-0.12, 0.06, 0);
            const wingR = new THREE.Mesh(wingGeo, wingMat); wingR.position.set(0.12, 0.06, 0);
            bug.add(wingL, wingR);

            bug.scale.setScalar(0.45);
            return { mesh: bug, wingL, wingR };
        }

        function spawnMosquito() {
            const { mesh, wingL, wingR } = createRealisticMosquito();
            mesh.position.set(
                (Math.random() - 0.5) * 5,
                (Math.random() - 0.5) * 6 + 1,
                -0.5 + (Math.random() - 0.5) * 1.5 // Strictly set behind racquet
            );
            mesh.userData = { wingL, wingR, phase: Math.random() * 100 };
            bugsGroup.add(mesh);
        }

        for (let i = 0; i < 9; i++) spawnMosquito();
        setInterval(() => { if (bugsGroup.children.length < 12) spawnMosquito(); }, 1200);

        // 7. Audio Engine
        let audioCtx;
        function playZapSound(kills = 1) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const t = audioCtx.currentTime;
            const masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(Math.min(0.22 + kills * 0.05, 0.45), t);
            masterGain.connect(audioCtx.destination);

            const bufferSize = audioCtx.sampleRate * 0.05; 
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }
            
            const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'highpass'; noiseFilter.frequency.setValueAtTime(900, t);
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.8, t);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);

            noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(masterGain);

            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(280 + kills * 40, t);
            osc.frequency.exponentialRampToValueAtTime(40, t + 0.06);

            oscGain.gain.setValueAtTime(0.9, t);
            oscGain.gain.exponentialRampToValueAtTime(0.01, t + 0.06);

            osc.connect(oscGain); oscGain.connect(masterGain);

            noise.start(t); osc.start(t); osc.stop(t + 0.06);
        }

        function createSparkVFX(pos) {
            const count = 25;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const vels = [];

            for (let i = 0; i < count; i++) {
                positions[i * 3] = pos.x; positions[i * 3 + 1] = pos.y; positions[i * 3 + 2] = pos.z;
                vels.push((Math.random() - 0.5) * 0.35, (Math.random() - 0.5) * 0.35, (Math.random() - 0.5) * 0.35);
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ color: 0x00ffff, size: 0.18, transparent: true, blending: THREE.AdditiveBlending });
            const pSystem = new THREE.Points(geo, mat);
            scene.add(pSystem);

            let frame = 0;
            function animSparks() {
                frame++;
                const p = pSystem.geometry.attributes.position.array;
                for (let i = 0; i < count; i++) {
                    p[i*3] += vels[i*3]; p[i*3+1] += vels[i*3+1]; p[i*3+2] += vels[i*3+2];
                }
                pSystem.geometry.attributes.position.needsUpdate = true;
                mat.opacity -= 0.05;
                if (frame < 20) requestAnimationFrame(animSparks);
                else scene.remove(pSystem);
            }
            animSparks();
        }

        // 8. Pointer & Hold-Release State Management
        const mouse = new THREE.Vector2();
        let score = 0;
        let isHolding = false;
        let zapActiveTimer = 0;

        const scoreUI = document.getElementById('score');
        const alertUI = document.getElementById('alert');

        function updatePointer(clientX, clientY) {
            const rect = container.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            mouse.x = (x / rect.width) * 2 - 1;
            mouse.y = -(y / rect.height) * 2 + 1;

            const vector = new THREE.Vector3(mouse.x, mouse.y, 0.5).unproject(camera);
            const dir = vector.sub(camera.position).normalize();
            const dist = -camera.position.z / dir.z;
            const pos = camera.position.clone().add(dir.multiplyScalar(dist));

            // Position Racquet at Z = 1.8 so mosquitoes are always behind
            racquet.position.set(pos.x, pos.y, 1.8);
            racquet.rotation.y = mouse.x * 0.25;
            racquet.rotation.x = -mouse.y * 0.25;
            
            handLight.position.set(pos.x, pos.y - 2, pos.z + 1);
            zapLight.position.copy(racquet.position);
        }

        // Hold and Release Controls
        function onPointerDown(clientX, clientY) {
            isHolding = true;
            updatePointer(clientX, clientY);
        }

        function onPointerUp() {
            if (isHolding) {
                isHolding = false;
                zapActiveTimer = 12; // Activate discharge window for multi-kill
            }
        }

        window.addEventListener('mousemove', (e) => updatePointer(e.clientX, e.clientY));
        window.addEventListener('mousedown', (e) => onPointerDown(e.clientX, e.clientY));
        window.addEventListener('mouseup', onPointerUp);

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) updatePointer(e.touches[0].clientX, e.touches[0].clientY);
        });
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
        });
        window.addEventListener('touchend', onPointerUp);

        // 9. Main Game Loop
        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.003;
            const racquetPos = racquet.position;

            if (score >= 15) { alertUI.style.display = 'block'; }

            // Hold Visual Feedback (Glow / Charge effect)
            if (isHolding) {
                netMesh.material.color.setHex(0xffaa00); // Gold electric charge
                zapLight.intensity = 3 + Math.sin(Date.now() * 0.03) * 2;
            } else if (zapActiveTimer > 0) {
                netMesh.material.color.setHex(0x00ffff); // Cyan discharge pulse
                zapLight.intensity = 10;
            } else {
                netMesh.material.color.setHex(0xffffff);
                zapLight.intensity = 0;
            }

            let killsThisFrame = 0;

            // Mosquito Processing Loop
            for (let i = bugsGroup.children.length - 1; i >= 0; i--) {
                const bug = bugsGroup.children[i];

                // STRICT Z-ORDER: Mosquitoes are always placed behind the racquet plane
                if (bug.position.z > racquetPos.z - 0.4) {
                    bug.position.z = racquetPos.z - 0.4;
                }

                // Check Multi-Kill condition during Release Discharge
                if (zapActiveTimer > 0) {
                    const dx = bug.position.x - racquetPos.x;
                    const dy = (bug.position.y - racquetPos.y) / 1.35;
                    const dist2D = Math.sqrt(dx * dx + dy * dy);

                    if (dist2D < 1.25) {
                        createSparkVFX(bug.position);
                        bugsGroup.remove(bug);
                        score++;
                        killsThisFrame++;
                        scoreUI.innerText = score;
                        continue;
                    }
                }

                // Balanced Flee Logic (>15 Zaps): Difficult to score, but still catchable!
                if (score >= 15) {
                    const fleeVec = bug.position.clone().sub(racquetPos);
                    fleeVec.z = 0; // Maintain Z-plane behind racquet
                    const distToRacquet = fleeVec.length();

                    if (distToRacquet < 3.2) {
                        fleeVec.normalize();
                        // Controlled flee speed (0.055) + zig-zag jitter allows strategic trapping
                        bug.position.addScaledVector(fleeVec, 0.055); 
                        bug.position.x += (Math.random() - 0.5) * 0.05;
                        bug.position.y += (Math.random() - 0.5) * 0.05;

                        // Clamp inside playable room boundaries
                        bug.position.x = THREE.MathUtils.clamp(bug.position.x, -2.8, 2.8);
                        bug.position.y = THREE.MathUtils.clamp(bug.position.y, -3.5, 4.2);
                    } else {
                        bug.position.x += Math.sin(time * 2 + bug.userData.phase) * 0.025;
                        bug.position.y += Math.cos(time * 2 + bug.userData.phase) * 0.025;
                    }
                } else {
                    bug.position.x += Math.sin(time + bug.userData.phase) * 0.015;
                    bug.position.y += Math.cos(time * 0.8 + bug.userData.phase) * 0.015;
                }

                bug.userData.wingL.rotation.y = Math.sin(Date.now() * 0.18) * 0.9;
                bug.userData.wingR.rotation.y = -Math.sin(Date.now() * 0.18) * 0.9;
            }

            if (killsThisFrame > 0) {
                playZapSound(killsThisFrame);
            }

            if (zapActiveTimer > 0) {
                zapActiveTimer--;
            }

            composer.render();
        }
        animate();
    </script>
</body>
</html>
