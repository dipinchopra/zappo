<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Mosquito Zapper - Hover & Flee Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #05050d; cursor: none; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; }
        #ui {
            position: absolute; top: 25px; left: 30px;
            font-size: 36px; font-weight: 800; color: #00f0ff;
            text-shadow: 0 0 15px rgba(0,240,255,0.8), 2px 2px 4px #000;
            z-index: 100; pointer-events: none; letter-spacing: 2px;
        }
        #warning {
            position: absolute; top: 75px; left: 30px;
            font-size: 18px; font-weight: 600; color: #ff3366;
            text-shadow: 0 0 10px rgba(255,51,102,0.8);
            z-index: 100; pointer-events: none; display: none;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">ZAPS: <span id="score">0</span></div>
    <div id="warning">⚠️ ALERT: MOSQUITOES ARE FLEEING!</div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // 1. Renderer & Scene Setup
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0a1a, 0.04);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 9);

        // 2. Post-Processing Bloom
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.5, 0.2));

        // 3. Lighting & Floor
        scene.add(new THREE.AmbientLight(0xddeeff, 0.4));
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
        mainLight.position.set(5, 8, 5);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const zapLight = new THREE.PointLight(0x00f0ff, 2, 12);
        scene.add(zapLight);

        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(30, 30),
            new THREE.MeshStandardMaterial({ color: 0x1a1c29, roughness: 0.3, metalness: 0.1 })
        );
        floor.position.z = -2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Textures
        function createStripeTex() {
            const c = document.createElement('canvas'); c.width = 128; c.height = 128;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#111111'; ctx.fillRect(0, 0, 128, 128);
            ctx.fillStyle = '#dddddd';
            for (let i = 0; i < 128; i += 20) { ctx.fillRect(0, i, 128, 6); }
            return new THREE.CanvasTexture(c);
        }
        const stripeTexture = createStripeTex();

        // 4. Racquet Model
        function createRacquet() {
            const group = new THREE.Group();
            const frameMat = new THREE.MeshPhysicalMaterial({ color: 0x0099ff, roughness: 0.1, clearcoat: 1.0 });
            const frame = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.1, 16, 64), frameMat);
            frame.castShadow = true;
            group.add(frame);

            const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.2, 2.5, 16), new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.6 }));
            handle.position.y = -2.5;
            handle.castShadow = true;
            group.add(handle);

            const grid = new THREE.Mesh(
                new THREE.PlaneGeometry(2.6, 2.8, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.35 })
            );
            group.add(grid);
            return group;
        }

        const racquet = createRacquet();
        scene.add(racquet);

        // 5. Realistic Small Mosquito Builder
        function createRealisticMosquito() {
            const bug = new THREE.Group();

            const bodyMat = new THREE.MeshStandardMaterial({ map: stripeTexture, roughness: 0.7 });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.8 });
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0022 });
            const wingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.5, roughness: 0.1, side: THREE.DoubleSide });

            // Abdomen
            const abdomen = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.5, 8), bodyMat);
            abdomen.rotation.x = Math.PI / 2.3;
            abdomen.position.set(0, -0.05, -0.25);
            bug.add(abdomen);

            // Thorax
            const thorax = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), darkMat);
            bug.add(thorax);

            // Head & Eyes
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), darkMat);
            head.position.set(0, 0.03, 0.12);
            
            const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.02, 6, 6), eyeMat); eyeL.position.set(-0.04, 0.05, 0.14);
            const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.02, 6, 6), eyeMat); eyeR.position.set(0.04, 0.05, 0.14);
            bug.add(head, eyeL, eyeR);

            // Needle Proboscis
            const proboscis = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.001, 0.35), darkMat);
            proboscis.rotation.x = Math.PI / 2.6;
            proboscis.position.set(0, -0.04, 0.28);
            bug.add(proboscis);

            // 6 Segmented Legs
            const legMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            for (let i = 0; i < 6; i++) {
                const legGroup = new THREE.Group();
                const legSeg1 = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.25), legMat);
                legSeg1.position.y = -0.12;
                legSeg1.rotation.z = (i % 2 === 0 ? -1 : 1) * 0.8;
                
                const legSeg2 = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.002, 0.3), legMat);
                legSeg2.position.set(i % 2 === 0 ? -0.12 : 0.12, -0.22, 0);
                legSeg2.rotation.z = (i % 2 === 0 ? 1 : -1) * 0.4;

                legGroup.add(legSeg1, legSeg2);
                legGroup.position.set(i % 2 === 0 ? -0.07 : 0.07, -0.02, (Math.floor(i / 2) - 1) * 0.08);
                bug.add(legGroup);
            }

            // Wings
            const wingGeo = new THREE.PlaneGeometry(0.45, 0.14);
            const wingL = new THREE.Mesh(wingGeo, wingMat); wingL.position.set(-0.22, 0.1, 0);
            const wingR = new THREE.Mesh(wingGeo, wingMat); wingR.position.set(0.22, 0.1, 0);
            bug.add(wingL, wingR);

            bug.scale.setScalar(0.7);
            return { mesh: bug, wingL, wingR };
        }

        // 6. Mosquito Manager
        const bugsGroup = new THREE.Group();
        scene.add(bugsGroup);

        function spawnBug() {
            const { mesh, wingL, wingR } = createRealisticMosquito();
            mesh.position.set(
                (Math.random() - 0.5) * 12,
                (Math.random() - 0.5) * 7,
                (Math.random() - 0.5) * 3 + 1
            );
            mesh.userData = { wingL, wingR, phase: Math.random() * 100 };
            bugsGroup.add(mesh);
        }

        for (let i = 0; i < 7; i++) spawnBug();
        setInterval(() => {
            if (bugsGroup.children.length < 10) spawnBug();
        }, 1500);

        // 7. Audio & Particles
        let audioCtx;
        function playZapSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.12);
        }

        function createSparkVFX(pos) {
            const count = 30;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const vels = [];

            for (let i = 0; i < count; i++) {
                positions[i * 3] = pos.x; positions[i * 3 + 1] = pos.y; positions[i * 3 + 2] = pos.z;
                vels.push((Math.random() - 0.5) * 0.35, (Math.random() - 0.5) * 0.35, (Math.random() - 0.5) * 0.35);
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ color: 0x00ffff, size: 0.2, transparent: true, blending: THREE.AdditiveBlending });
            const pSystem = new THREE.Points(geo, mat);
            scene.add(pSystem);

            let frame = 0;
            function animSparks() {
                frame++;
                const p = pSystem.geometry.attributes.position.array;
                for (let i = 0; i < count; i++) {
                    p[i*3] += vels[i*3]; p[i*3+1] += vels[i*3+1]; p[i*3+2] += vels[i*3+2];
                }
                pSystem.geometry.attributes.position.needsUpdate = true;
                mat.opacity -= 0.05;
                if (frame < 20) requestAnimationFrame(animSparks);
                else scene.remove(pSystem);
            }
            animSparks();
        }

        // 8. Tracking
        const mouse = new THREE.Vector2();
        let score = 0;
        const scoreUI = document.getElementById('score');
        const warningUI = document.getElementById('warning');

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            const vector = new THREE.Vector3(mouse.x, mouse.y, 0.5).unproject(camera);
            const dir = vector.sub(camera.position).normalize();
            const dist = -camera.position.z / dir.z;
            const pos = camera.position.clone().add(dir.multiplyScalar(dist));
            
            racquet.position.copy(pos);
            racquet.rotation.y = mouse.x * 0.4;
            racquet.rotation.x = -mouse.y * 0.4;
            zapLight.position.copy(pos);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // 9. Game Loop (Hover Detection & AI Logic)
        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.003;
            const racquetPos = racquet.position;

            if (score >= 15) {
                warningUI.style.display = 'block';
            }

            for (let i = bugsGroup.children.length - 1; i >= 0; i--) {
                const bug = bugsGroup.children[i];
                
                // HOVER KILL: Check distance to racquet net
                const distanceToRacquet = bug.position.distanceTo(racquetPos);
                
                if (distanceToRacquet < 1.4) {
                    createSparkVFX(bug.position);
                    playZapSound();

                    zapLight.intensity = 12;
                    setTimeout(() => zapLight.intensity = 2, 100);

                    bugsGroup.remove(bug);
                    score++;
                    scoreUI.innerText = score;
                    continue;
                }

                // FLEEING LOGIC (>15 Zaps)
                if (score >= 15) {
                    const fleeVector = bug.position.clone().sub(racquetPos);
                    const dist = fleeVector.length();

                    if (dist < 4.5) {
                        fleeVector.normalize();
                        bug.position.addScaledVector(fleeVector, 0.12); // Speed away
                        bug.position.x += (Math.random() - 0.5) * 0.08; // Jitter
                        bug.position.y += (Math.random() - 0.5) * 0.08;
                    } else {
                        bug.position.x += Math.sin(time * 3 + bug.userData.phase) * 0.05;
                        bug.position.y += Math.cos(time * 3 + bug.userData.phase) * 0.05;
                    }
                } else {
                    bug.position.x += Math.sin(time + bug.userData.phase) * 0.02;
                    bug.position.y += Math.cos(time * 0.8 + bug.userData.phase) * 0.02;
                }

                bug.userData.wingL.rotation.y = Math.sin(Date.now() * 0.15) * 0.9;
                bug.userData.wingR.rotation.y = -Math.sin(Date.now() * 0.15) * 0.9;
            }

            composer.render();
        }
        animate();
    </script>
</body>
</html>
