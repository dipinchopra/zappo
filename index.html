<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Mosquito Zapper - Fixed</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; cursor: none;}
        #ui {
            position: absolute; top: 20px; left: 20px;
            font-family: sans-serif; font-size: 32px; font-weight: bold;
            color: #fff; text-shadow: 2px 2px 0 #000; z-index: 100; pointer-events: none;
        }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.150.1/build/three.module.js" } }
    </script>
</head>
<body>
    <div id="ui">Zaps: <span id="score">0</span></div>

    <script type="module">
        import * as THREE from 'three';

        // 1. Scene Setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x87CEEB, 10, 50);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 10;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x87CEEB); // FIX: Paints the WebGL background blue
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 5);
        scene.add(directionalLight);

        // 2. Procedural Racquet (Bypasses Image Block)
        const racquetGroup = new THREE.Group();
        
        // Racquet Handle
        const handleGeo = new THREE.CylinderGeometry(0.15, 0.15, 2);
        const handleMat = new THREE.MeshStandardMaterial({color: 0x333333});
        const handle = new THREE.Mesh(handleGeo, handleMat);
        handle.position.y = -2;
        racquetGroup.add(handle);

        // Racquet Hoop
        const hoopGeo = new THREE.TorusGeometry(1.2, 0.1, 16, 100);
        const hoopMat = new THREE.MeshStandardMaterial({color: 0x33b5e5}); // Blue rim
        const hoop = new THREE.Mesh(hoopGeo, hoopMat);
        racquetGroup.add(hoop);

        // Racquet Net (Electric Grid)
        const netGeo = new THREE.CircleGeometry(1.2, 32);
        const netMat = new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.3, side: THREE.DoubleSide, wireframe: true});
        const net = new THREE.Mesh(netGeo, netMat);
        racquetGroup.add(net);
        
        scene.add(racquetGroup);

        // 3. Better Mosquito Generation
        const bugsGroup = new THREE.Group();
        scene.add(bugsGroup);

        function spawnMosquito() {
            const bug = new THREE.Group();
            
            // Body
            const bodyGeo = new THREE.CapsuleGeometry(0.15, 0.3, 4, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            bug.add(body);

            // Wings
            const wingGeo = new THREE.PlaneGeometry(0.6, 0.2);
            const wingMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, side: THREE.DoubleSide });
            const wingLeft = new THREE.Mesh(wingGeo, wingMat);
            wingLeft.position.set(-0.3, 0.2, 0);
            const wingRight = new THREE.Mesh(wingGeo, wingMat);
            wingRight.position.set(0.3, 0.2, 0);
            bug.add(wingLeft, wingRight);

            bug.position.set((Math.random() - 0.5) * 15, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 5 + 2);
            bug.userData = { rx: Math.random() * 0.1, ry: Math.random() * 0.1, wingLeft, wingRight };
            bugsGroup.add(bug);
        }
        setInterval(spawnMosquito, 1500);

        // 4. Raycasting & Audio
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let score = 0;
        const scoreUI = document.getElementById('score');

        let audioCtx;
        function playZap() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        const flashLight = new THREE.PointLight(0x00ffff, 0, 10);
        scene.add(flashLight);

        // Track Racquet
        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            const vector = new THREE.Vector3(mouse.x, mouse.y, 0.5);
            vector.unproject(camera);
            const dir = vector.sub(camera.position).normalize();
            const distance = -camera.position.z / dir.z;
            const pos = camera.position.clone().add(dir.multiplyScalar(distance));
            racquetGroup.position.copy(pos);
            
            // Add a slight tilt to the racquet based on mouse position
            racquetGroup.rotation.y = mouse.x * 0.5;
            racquetGroup.rotation.x = -mouse.y * 0.5;
        });

        // Click to Swat
        window.addEventListener('mousedown', () => {
            racquetGroup.position.z -= 1; // Swing forward
            setTimeout(() => racquetGroup.position.z += 1, 100);

            raycaster.setFromCamera(mouse, camera);
            // FIX: Check recursively for hits on the bug group
            const intersects = raycaster.intersectObjects(bugsGroup.children, true);
            
            if (intersects.length > 0) {
                // Find the parent group (the whole bug) of the mesh that was hit
                let hitBug = intersects[0].object.parent; 
                
                flashLight.position.copy(hitBug.position);
                flashLight.intensity = 5;
                setTimeout(() => flashLight.intensity = 0, 100);

                playZap();
                bugsGroup.remove(hitBug);
                score++;
                scoreUI.innerText = score;
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 5. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            
            bugsGroup.children.forEach(bug => {
                // Wiggle movement
                bug.position.x += Math.sin(Date.now() * 0.005 * bug.userData.rx) * 0.05;
                bug.position.y += Math.cos(Date.now() * 0.005 * bug.userData.ry) * 0.05;
                
                // Flap wings
                bug.userData.wingLeft.rotation.y = Math.sin(Date.now() * 0.05) * 0.8;
                bug.userData.wingRight.rotation.y = -Math.sin(Date.now() * 0.05) * 0.8;
            });

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
