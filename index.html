<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Indian House Mosquito Zapper 3D</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #05050a; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            user-select: none; 
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: calc(100vh * (9 / 16));
            max-height: calc(100vw * (16 / 9));
            aspect-ratio: 9 / 16;
            background: #111a1f;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.25);
            overflow: hidden;
            border-radius: 8px;
        }

        #ui {
            position: absolute; top: 20px; left: 20px;
            font-size: 28px; font-weight: 800; color: #00f0ff;
            text-shadow: 0 0 10px rgba(0,240,255,0.8), 2px 2px 4px #000;
            z-index: 100; pointer-events: none; letter-spacing: 1px;
        }

        #hint {
            position: absolute; bottom: 20px; width: 100%;
            text-align: center; font-size: 14px; font-weight: 700; color: #ffffff;
            text-shadow: 0 0 8px rgba(0,240,255,0.8), 1px 1px 3px #000;
            z-index: 100; pointer-events: none; opacity: 0.85;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            cursor: none;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="game-container">
        <div id="ui">ZAPS: <span id="score">0</span></div>
        <div id="hint">HOLD TO CHARGE ⚡ RELEASE TO ZAP MULTIPLE</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const container = document.getElementById('game-container');

        // 1. Scene & Camera Setup
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x111622, 0.02);

        const camera = new THREE.PerspectiveCamera(60, 9 / 16, 0.1, 100);
        camera.position.set(0, 0, 8.5);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(container.clientWidth, container.clientHeight), 0.75, 0.4, 0.3));

        // 2. Room Lighting
        scene.add(new THREE.AmbientLight(0xffeedd, 0.85));

        const tubeLight = new THREE.PointLight(0xfffaed, 3.2, 22);
        tubeLight.position.set(0, 4.1, -1.8);
        tubeLight.castShadow = true;
        scene.add(tubeLight);

        const handLight = new THREE.PointLight(0xffe0c0, 1.4, 6);
        scene.add(handLight);

        const zapLight = new THREE.PointLight(0x00f0ff, 0, 10);
        scene.add(zapLight);

        // 3. Room Wall Texture Generator (Teal-ish Wall)
        function createWallTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 0, 1024);
            grad.addColorStop(0, '#132830');
            grad.addColorStop(0.5, '#17333d');
            grad.addColorStop(1.0, '#0d1e24');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1024, 1024);

            // Subtle plaster grain noise
            const imgData = ctx.getImageData(0, 0, 1024, 1024);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                const noise = (Math.random() - 0.5) * 12;
                data[i] = Math.min(255, Math.max(0, data[i] + noise));
                data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise));
                data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise));
            }
            ctx.putImageData(imgData, 0, 0);
            return new THREE.CanvasTexture(canvas);
        }

        const wall = new THREE.Mesh(
            new THREE.PlaneGeometry(14, 22),
            new THREE.MeshStandardMaterial({ 
                map: createWallTexture(),
                roughness: 0.9 
            })
        );
        wall.position.z = -3;
        wall.receiveShadow = true;
        scene.add(wall);

        // Tube Light Fixture Top
        const tubeLightGroup = new THREE.Group();
        const tubeCasing = new THREE.Mesh(
            new THREE.BoxGeometry(3.6, 0.14, 0.18),
            new THREE.MeshStandardMaterial({ color: 0xd8d8d8, metalness: 0.5, roughness: 0.3 })
        );
        tubeCasing.position.set(0, 4.35, -2.85);

        const tubeGlass = new THREE.Mesh(
            new THREE.CylinderGeometry(0.045, 0.045, 3.3, 16),
            new THREE.MeshBasicMaterial({ color: 0xfffbee })
        );
        tubeGlass.rotation.z = Math.PI / 2;
        tubeGlass.position.set(0, 4.31, -2.76);

        tubeLightGroup.add(tubeCasing, tubeGlass);
        scene.add(tubeLightGroup);

        // 4. Starry Night Window View Texture Generator
        function createStarryNightTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');

            const skyGrad = ctx.createLinearGradient(0, 0, 0, 512);
            skyGrad.addColorStop(0, '#020307');
            skyGrad.addColorStop(0.5, '#050812');
            skyGrad.addColorStop(1.0, '#010204');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, 512, 512);

            // Small White Dots (Stars)
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 120; i++) {
                const sx = Math.random() * 512;
                const sy = Math.random() * 512;
                const size = Math.random() * 1.4 + 0.3;
                ctx.globalAlpha = 0.3 + Math.random() * 0.7;
                ctx.beginPath(); 
                ctx.arc(sx, sy, size, 0, Math.PI * 2); 
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            // Small Tiny Moon inside window pane
            const moonX = 380, moonY = 110;
            const moonGlow = ctx.createRadialGradient(moonX, moonY, 2, moonX, moonY, 30);
            moonGlow.addColorStop(0, 'rgba(255, 255, 245, 0.95)');
            moonGlow.addColorStop(0.4, 'rgba(180, 210, 255, 0.25)');
            moonGlow.addColorStop(1, 'rgba(2, 3, 7, 0)');
            ctx.fillStyle = moonGlow;
            ctx.beginPath(); ctx.arc(moonX, moonY, 30, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#fffee8';
            ctx.beginPath(); ctx.arc(moonX, moonY, 9, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#050812';
            ctx.beginPath(); ctx.arc(moonX + 3, moonY - 1, 8, 0, Math.PI * 2); ctx.fill();

            return new THREE.CanvasTexture(canvas);
        }

        // 5. Window Frame Setup (Placed strictly inside the room wall)
        const windowGroup = new THREE.Group();
        windowGroup.position.set(0, 1.35, -2.92);

        // Window pane background showing the Starry Night
        const windowPane = new THREE.Mesh(
            new THREE.PlaneGeometry(1.7, 2.3),
            new THREE.MeshBasicMaterial({ map: createStarryNightTexture() })
        );
        windowPane.position.z = -0.01;
        windowGroup.add(windowPane);

        // Wooden Window Frame
        const frameMat = new THREE.MeshStandardMaterial({ color: 0x5a3825, roughness: 0.6 });
        const windowBorderTop = new THREE.Mesh(new THREE.BoxGeometry(1.86, 0.1, 0.12), frameMat); windowBorderTop.position.y = 1.15;
        const windowBorderBottom = new THREE.Mesh(new THREE.BoxGeometry(1.86, 0.1, 0.12), frameMat); windowBorderBottom.position.y = -1.15;
        const windowBorderLeft = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.4, 0.12), frameMat); windowBorderLeft.position.x = -0.88;
        const windowBorderRight = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.4, 0.12), frameMat); windowBorderRight.position.x = 0.88;
        const windowBarH = new THREE.Mesh(new THREE.BoxGeometry(1.76, 0.05, 0.08), frameMat);
        const windowBarV = new THREE.Mesh(new THREE.BoxGeometry(0.05, 2.3, 0.08), frameMat);

        windowGroup.add(windowBorderTop, windowBorderBottom, windowBorderLeft, windowBorderRight, windowBarH, windowBarV);

        // Curtains
        const curtainMat = new THREE.MeshStandardMaterial({ color: 0x781c24, roughness: 0.8 });
        const curtainRod = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 2.4), new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.8 }));
        curtainRod.rotation.z = Math.PI / 2; curtainRod.position.set(0, 1.28, 0.05);

        const curtainLeft = new THREE.Mesh(new THREE.BoxGeometry(0.55, 2.35, 0.08), curtainMat); curtainLeft.position.set(-0.95, 0, 0.02);
        const curtainRight = new THREE.Mesh(new THREE.BoxGeometry(0.55, 2.35, 0.08), curtainMat); curtainRight.position.set(0.95, 0, 0.02);

        windowGroup.add(curtainRod, curtainLeft, curtainRight);
        scene.add(windowGroup);

        // 6. Table & Furniture
        function createBeigeWoodVeneerTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 1024, 0);
            grad.addColorStop(0, '#c3956c');
            grad.addColorStop(0.3, '#d8ab82');
            grad.addColorStop(0.6, '#caa078');
            grad.addColorStop(1.0, '#b4855d');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1024, 1024);

            ctx.lineWidth = 1.2;
            for (let i = 0; i < 400; i++) {
                const y = Math.random() * 1024;
                ctx.strokeStyle = (i % 2 === 0) ? 'rgba(110, 75, 45, 0.18)' : 'rgba(235, 205, 175, 0.15)';
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.bezierCurveTo(340, y + (Math.random() - 0.5) * 35, 680, y + (Math.random() - 0.5) * 35, 1024, y);
                ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2, 1);
            return tex;
        }

        const tableMat = new THREE.MeshPhysicalMaterial({
            map: createBeigeWoodVeneerTexture(),
            color: 0xdec2a6,
            roughness: 0.35,
            metalness: 0.05,
            clearcoat: 0.5,
            clearcoatRoughness: 0.3
        });

        const tableTop = new THREE.Mesh(new THREE.BoxGeometry(12, 1.8, 4), tableMat);
        tableTop.position.set(0, -4.8, -1.0);
        tableTop.receiveShadow = true;
        scene.add(tableTop);

        const radioGroup = new THREE.Group();
        radioGroup.add(new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.9, 0.6), new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 })));
        const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 1.4), new THREE.MeshStandardMaterial({ metalness: 0.9 }));
        antenna.rotation.z = -Math.PI / 4; antenna.position.set(-0.6, 0.8, -0.1);
        radioGroup.add(antenna);
        radioGroup.position.set(-1.8, -3.4, -0.8);
        scene.add(radioGroup);

        const vaseGroup = new THREE.Group();
        vaseGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.45, 1.0, 16), new THREE.MeshStandardMaterial({ color: 0xbf532c, roughness: 0.6 })));
        vaseGroup.position.set(2.0, -3.4, -0.8);
        scene.add(vaseGroup);

        // Incense & Smoke
        const incenseGroup = new THREE.Group();
        const holderBase = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 0.03, 12), new THREE.MeshStandardMaterial({ color: 0xb87333, metalness: 0.8, roughness: 0.3 }));
        holderBase.position.y = -3.88;
        incenseGroup.add(holderBase);

        const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.75), new THREE.MeshStandardMaterial({ color: 0x3d2817, roughness: 0.9 }));
        stick.rotation.z = -0.25; stick.position.set(0.08, -3.53, 0);
        incenseGroup.add(stick);

        const emberTip = new THREE.Mesh(new THREE.SphereGeometry(0.014, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff4500 }));
        emberTip.position.set(0.17, -3.18, 0);
        incenseGroup.add(emberTip);

        incenseGroup.position.set(1.1, 0, -0.6);
        scene.add(incenseGroup);

        const smokeCount = 22;
        const smokeGeo = new THREE.BufferGeometry();
        const smokePos = new Float32Array(smokeCount * 3);
        const smokeData = [];
        const emberWorldPos = new THREE.Vector3(1.27, -3.18, -0.6);

        for (let i = 0; i < smokeCount; i++) {
            smokePos[i * 3] = emberWorldPos.x;
            smokePos[i * 3 + 1] = emberWorldPos.y;
            smokePos[i * 3 + 2] = emberWorldPos.z;
            
            smokeData.push({
                age: Math.random() * 180,
                maxAge: 160 + Math.random() * 60,
                speedY: 0.004 + Math.random() * 0.002,
                driftX: (Math.random() - 0.5) * 0.0015,
                phase: Math.random() * Math.PI * 2
            });
        }

        smokeGeo.setAttribute('position', new THREE.BufferAttribute(smokePos, 3));

        function createSmokeTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(230, 235, 240, 0.22)');
            grad.addColorStop(0.5, 'rgba(200, 210, 220, 0.06)');
            grad.addColorStop(1, 'rgba(200, 210, 220, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        const smokeMat = new THREE.PointsMaterial({
            size: 0.22,
            map: createSmokeTexture(),
            transparent: true,
            opacity: 0.45,
            depthWrite: false,
            blending: THREE.NormalBlending
        });

        const smokeParticles = new THREE.Points(smokeGeo, smokeMat);
        scene.add(smokeParticles);

        function updateIncenseSmoke() {
            const positions = smokeParticles.geometry.attributes.position.array;
            for (let i = 0; i < smokeCount; i++) {
                const d = smokeData[i];
                d.age++;
                if (d.age >= d.maxAge) {
                    d.age = 0;
                    positions[i * 3] = emberWorldPos.x;
                    positions[i * 3 + 1] = emberWorldPos.y;
                    positions[i * 3 + 2] = emberWorldPos.z;
                } else {
                    positions[i * 3 + 1] += d.speedY;
                    positions[i * 3] += Math.sin(d.age * 0.035 + d.phase) * 0.0018 + d.driftX;
                    positions[i * 3 + 2] += Math.cos(d.age * 0.025 + d.phase) * 0.001;
                }
            }
            smokeParticles.geometry.attributes.position.needsUpdate = true;
        }

        // 7. Racquet Net Texture Setup
        function createLightningNetTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, 512, 512);

            ctx.save();
            ctx.beginPath();
            ctx.ellipse(256, 256, 250, 250, 0, 0, Math.PI * 2);
            ctx.clip();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.lineWidth = 2;
            for (let i = 0; i <= 512; i += 16) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
            }
            ctx.restore();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(275, 140); ctx.lineTo(220, 245); ctx.lineTo(260, 245);
            ctx.lineTo(235, 370); ctx.lineTo(295, 260); ctx.lineTo(255, 260);
            ctx.closePath(); ctx.fill();

            return new THREE.CanvasTexture(canvas);
        }

        const netTexture = createLightningNetTexture();

        // 8. Racquet & Hand
        let netMesh;
        function createRacquetWithHand() {
            const group = new THREE.Group();

            const frameMat = new THREE.MeshPhysicalMaterial({ color: 0x3fbac2, roughness: 0.2, clearcoat: 0.8 });
            const frame = new THREE.Mesh(new THREE.TorusGeometry(1.05, 0.08, 16, 48), frameMat);
            frame.scale.set(1.0, 1.35, 1.0);
            group.add(frame);

            const netShape = new THREE.Shape();
            netShape.absellipse(0, 0, 1.05, 1.35, 0, Math.PI * 2, false, 0);
            const netGeo = new THREE.ShapeGeometry(netShape);
            
            const posAttr = netGeo.attributes.position;
            const uvAttr = netGeo.attributes.uv;
            for (let i = 0; i < posAttr.count; i++) {
                const u = (posAttr.getX(i) / 1.05 + 1) * 0.5;
                const v = (posAttr.getY(i) / 1.35 + 1) * 0.5;
                uvAttr.setXY(i, u, v);
            }

            const netMat = new THREE.MeshBasicMaterial({ map: netTexture, transparent: true, opacity: 0.9, side: THREE.DoubleSide });
            netMesh = new THREE.Mesh(netGeo, netMat);
            group.add(netMesh);

            const handleMain = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.4, 16), new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.3 }));
            handleMain.position.y = -2.5;
            group.add(handleMain);

            const handGroup = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xd99a6c, roughness: 0.5 });

            const palm = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.5, 0.42), skinMat);
            palm.position.set(0.02, -2.5, 0.05);
            handGroup.add(palm);

            for(let i = 0; i < 4; i++) {
                const finger = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.42), skinMat);
                finger.rotation.x = Math.PI / 2.2; finger.rotation.y = -0.2;
                finger.position.set(-0.1, -2.3 - (i * 0.12), 0.15);
                handGroup.add(finger);
            }

            const thumb = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, 0.38), skinMat);
            thumb.rotation.z = -Math.PI / 3.5; thumb.position.set(0.16, -2.25, 0.18);
            handGroup.add(thumb);

            const forearm = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.26, 3.2), skinMat);
            forearm.position.set(0.08, -4.0, 0.02);
            handGroup.add(forearm);

            group.add(handGroup);
            group.traverse(child => { child.renderOrder = 100; });

            return group;
        }

        const racquet = createRacquetWithHand();
        scene.add(racquet);

        // 9. Mosquitoes & Bugs
        const bugsGroup = new THREE.Group();
        bugsGroup.renderOrder = 1;
        scene.add(bugsGroup);

        function createRealisticMosquito() {
            const bug = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1f1105, roughness: 0.8 });
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const wingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.5, side: THREE.DoubleSide });

            const abdomen = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.3, 6), bodyMat);
            abdomen.rotation.x = Math.PI / 2.3; abdomen.position.set(0, -0.03, -0.15);
            bug.add(abdomen);

            const thorax = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), bodyMat);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.03, 6, 6), bodyMat);
            head.position.set(0, 0.02, 0.07);
            
            const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.012, 6, 6), eyeMat); eyeL.position.set(-0.02, 0.03, 0.08);
            const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.012, 6, 6), eyeMat); eyeR.position.set(0.02, 0.03, 0.08);
            bug.add(thorax, head, eyeL, eyeR);

            const wingGeo = new THREE.PlaneGeometry(0.25, 0.08);
            const wingL = new THREE.Mesh(wingGeo, wingMat); wingL.position.set(-0.12, 0.06, 0);
            const wingR = new THREE.Mesh(wingGeo, wingMat); wingR.position.set(0.12, 0.06, 0);
            bug.add(wingL, wingR);

            bug.scale.setScalar(0.45);
            return { mesh: bug, wingL, wingR };
        }

        function spawnMosquito() {
            const { mesh, wingL, wingR } = createRealisticMosquito();
            mesh.position.set(
                (Math.random() - 0.5) * 5,
                (Math.random() - 0.5) * 6 + 1,
                -0.5 + (Math.random() - 0.5) * 1.5
            );
            mesh.userData = { wingL, wingR, phase: Math.random() * 100 };
            bugsGroup.add(mesh);
        }

        for (let i = 0; i < 10; i++) spawnMosquito();
        setInterval(() => { if (bugsGroup.children.length < 12) spawnMosquito(); }, 1200);

        // 10. Audio Engine
        let audioCtx;
        function ensureAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playZapSound(kills = 1) {
            ensureAudioContext();
            const t = audioCtx.currentTime;
            const masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(Math.min(0.22 + kills * 0.05, 0.45), t);
            masterGain.connect(audioCtx.destination);

            const bufferSize = audioCtx.sampleRate * 0.05; 
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }
            
            const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'highpass'; noiseFilter.frequency.setValueAtTime(900, t);
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.8, t);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);

            noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(masterGain);

            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(280 + kills * 40, t);
            osc.frequency.exponentialRampToValueAtTime(40, t + 0.06);

            oscGain.gain.setValueAtTime(0.9, t);
            oscGain.gain.exponentialRampToValueAtTime(0.01, t + 0.06);

            osc.connect(oscGain); oscGain.connect(masterGain);

            noise.start(t); osc.start(t); osc.stop(t + 0.06);
        }

        function playMosquitoFlyby() {
            if (!audioCtx) return;
            ensureAudioContext();

            const t = audioCtx.currentTime;
            const duration = 0.8 + Math.random() * 1.4;

            const osc = audioCtx.createOscillator();
            osc.type = 'sawtooth';

            const baseFreq = 460 + (Math.random() - 0.5) * 120; 
            const dopplerShift = 70 + Math.random() * 50;

            osc.frequency.setValueAtTime(baseFreq + dopplerShift, t);
            osc.frequency.exponentialRampToValueAtTime(baseFreq - dopplerShift, t + duration);

            const lfo = audioCtx.createOscillator();
            const lfoGain = audioCtx.createGain();
            lfo.frequency.setValueAtTime(42 + Math.random() * 18, t);
            lfoGain.gain.setValueAtTime(25, t);
            lfo.connect(osc.frequency);

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(2200, t);
            filter.Q.setValueAtTime(2.5, t);

            const panNode = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
            if (panNode) {
                panNode.pan.setValueAtTime((Math.random() - 0.5) * 1.6, t);
            }

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.001, t);
            gain.gain.exponentialRampToValueAtTime(0.12, t + duration * 0.4);
            gain.gain.exponentialRampToValueAtTime(0.001, t + duration);

            osc.connect(filter);
            filter.connect(gain);
            if (panNode) {
                gain.connect(panNode);
                panNode.connect(audioCtx.destination);
            } else {
                gain.connect(audioCtx.destination);
            }

            lfo.start(t);
            osc.start(t);
            lfo.stop(t + duration);
            osc.stop(t + duration);
        }

        function scheduleNextFlyby() {
            const nextDelay = 1800 + Math.random() * 4500;
            setTimeout(() => {
                if (bugsGroup.children.length > 0) {
                    playMosquitoFlyby();
                }
                scheduleNextFlyby();
            }, nextDelay);
        }
        scheduleNextFlyby();

        function createSparkVFX(pos) {
            const count = 25;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const vels = [];

            for (let i = 0; i < count; i++) {
                positions[i * 3] = pos.x; positions[i * 3 + 1] = pos.y; positions[i * 3 + 2] = pos.z;
                vels.push((Math.random() - 0.5) * 0.35, (Math.random() - 0.5) * 0.35, (Math.random() - 0.5) * 0.35);
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ color: 0x00ffff, size: 0.18, transparent: true, blending: THREE.AdditiveBlending });
            const pSystem = new THREE.Points(geo, mat);
            scene.add(pSystem);

            let frame = 0;
            function animSparks() {
                frame++;
                const p = pSystem.geometry.attributes.position.array;
                for (let i = 0; i < count; i++) {
                    p[i*3] += vels[i*3]; p[i*3+1] += vels[i*3+1]; p[i*3+2] += vels[i*3+2];
                }
                pSystem.geometry.attributes.position.needsUpdate = true;
                mat.opacity -= 0.05;
                if (frame < 20) requestAnimationFrame(animSparks);
                else scene.remove(pSystem);
            }
            animSparks();
        }

        // 11. Controls
        const mouse = new THREE.Vector2();
        let score = 0;
        let isHolding = false;
        let zapActiveTimer = 0;

        const scoreUI = document.getElementById('score');

        function updatePointer(clientX, clientY) {
            const rect = container.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            mouse.x = (x / rect.width) * 2 - 1;
            mouse.y = -(y / rect.height) * 2 + 1;

            const vector = new THREE.Vector3(mouse.x, mouse.y, 0.5).unproject(camera);
            const dir = vector.sub(camera.position).normalize();
            const dist = -camera.position.z / dir.z;
            const pos = camera.position.clone().add(dir.multiplyScalar(dist));

            racquet.position.set(pos.x, pos.y, 1.8);
            racquet.rotation.y = mouse.x * 0.25;
            racquet.rotation.x = -mouse.y * 0.25;
            
            handLight.position.set(pos.x, pos.y - 2, pos.z + 1);
            zapLight.position.copy(racquet.position);
        }

        function onPointerDown(clientX, clientY) {
            ensureAudioContext();
            isHolding = true;
            updatePointer(clientX, clientY);
        }

        function onPointerUp() {
            if (isHolding) {
                isHolding = false;
                zapActiveTimer = 12;
            }
        }

        window.addEventListener('mousemove', (e) => updatePointer(e.clientX, e.clientY));
        window.addEventListener('mousedown', (e) => onPointerDown(e.clientX, e.clientY));
        window.addEventListener('mouseup', onPointerUp);

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) updatePointer(e.touches[0].clientX, e.touches[0].clientY);
        });
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
        });
        window.addEventListener('touchend', onPointerUp);

        // 12. Game Loop
        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.003;
            const racquetPos = racquet.position;

            updateIncenseSmoke();

            if (isHolding) {
                netMesh.material.color.setHex(0xffaa00);
                zapLight.intensity = 3 + Math.sin(Date.now() * 0.03) * 2;
            } else if (zapActiveTimer > 0) {
                netMesh.material.color.setHex(0x00ffff);
                zapLight.intensity = 10;
            } else {
                netMesh.material.color.setHex(0xffffff);
                zapLight.intensity = 0;
            }

            let killsThisFrame = 0;

            for (let i = bugsGroup.children.length - 1; i >= 0; i--) {
                const bug = bugsGroup.children[i];

                if (bug.position.z > racquetPos.z - 0.4) {
                    bug.position.z = racquetPos.z - 0.4;
                }

                if (zapActiveTimer > 0) {
                    const dx = bug.position.x - racquetPos.x;
                    const dy = (bug.position.y - racquetPos.y) / 1.35;
                    const dist2D = Math.sqrt(dx * dx + dy * dy);

                    if (dist2D < 1.25) {
                        createSparkVFX(bug.position);
                        bugsGroup.remove(bug);
                        score++;
                        killsThisFrame++;
                        scoreUI.innerText = score;
                        continue;
                    }
                }

                if (score >= 15) {
                    const fleeVec = bug.position.clone().sub(racquetPos);
                    fleeVec.z = 0;
                    const distToRacquet = fleeVec.length();

                    if (distToRacquet < 3.2) {
                        fleeVec.normalize();
                        bug.position.addScaledVector(fleeVec, 0.055); 
                        bug.position.x += (Math.random() - 0.5) * 0.05;
                        bug.position.y += (Math.random() - 0.5) * 0.05;

                        bug.position.x = THREE.MathUtils.clamp(bug.position.x, -2.8, 2.8);
                        bug.position.y = THREE.MathUtils.clamp(bug.position.y, -3.5, 4.2);
                    } else {
                        bug.position.x += Math.sin(time * 2 + bug.userData.phase) * 0.025;
                        bug.position.y += Math.cos(time * 2 + bug.userData.phase) * 0.025;
                    }
                } else {
                    bug.position.x += Math.sin(time + bug.userData.phase) * 0.015;
                    bug.position.y += Math.cos(time * 0.8 + bug.userData.phase) * 0.015;
                }

                bug.userData.wingL.rotation.y = Math.sin(Date.now() * 0.18) * 0.9;
                bug.userData.wingR.rotation.y = -Math.sin(Date.now() * 0.18) * 0.9;
            }

            if (killsThisFrame > 0) {
                playZapSound(killsThisFrame);
            }

            if (zapActiveTimer > 0) {
                zapActiveTimer--;
            }

            composer.render();
        }
        animate();
    </script>
</body>
