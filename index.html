<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Mosquito Zapper</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            font-family: sans-serif; font-size: 32px; font-weight: bold;
            color: #fff; text-shadow: 2px 2px 0 #000; z-index: 100; pointer-events: none;
        }
    </style>
    <!-- Import Maps for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.150.1/build/three.module.js"
            }
        }
    </script>
</head>
<body>
    <div id="ui">Zaps: <span id="score">0</span></div>

    <script type="module">
        import * as THREE from 'three';

        // 1. Scene Setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x87CEEB, 10, 50);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 10;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 5);
        scene.add(directionalLight);

        // 2. The Racquet (Using your image)
        const textureLoader = new THREE.TextureLoader();
        const racquetTexture = textureLoader.load('image_a5dc23.jpg');
        
        const racquetGeometry = new THREE.PlaneGeometry(4, 4);
        const racquetMaterial = new THREE.MeshBasicMaterial({ 
            map: racquetTexture, 
            transparent: true, 
            side: THREE.DoubleSide 
        });
        const racquet = new THREE.Mesh(racquetGeometry, racquetMaterial);
        scene.add(racquet);

        // 3. Mosquito Generation
        const bugsGroup = new THREE.Group();
        scene.add(bugsGroup);
        const bugGeometry = new THREE.CapsuleGeometry(0.2, 0.4, 4, 8);
        const bugMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });

        function spawnMosquito() {
            const bug = new THREE.Mesh(bugGeometry, bugMaterial);
            bug.position.set(
                (Math.random() - 0.5) * 15,
                (Math.random() - 0.5) * 10,
                (Math.random() - 0.5) * 5 + 2
            );
            // Add custom data for erratic movement
            bug.userData = {
                rx: Math.random() * 0.1,
                ry: Math.random() * 0.1
            };
            bugsGroup.add(bug);
        }
        setInterval(spawnMosquito, 1500);

        // 4. Raycasting & Audio (Hit Detection)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let score = 0;
        const scoreUI = document.getElementById('score');

        let audioCtx;
        function playZap() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        // VFX Flash
        const flashLight = new THREE.PointLight(0x00ffff, 0, 10);
        scene.add(flashLight);

        // Mouse Move - Track Racquet
        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            // Make racquet follow cursor on a 2D plane in 3D space
            const vector = new THREE.Vector3(mouse.x, mouse.y, 0.5);
            vector.unproject(camera);
            const dir = vector.sub(camera.position).normalize();
            const distance = -camera.position.z / dir.z;
            const pos = camera.position.clone().add(dir.multiplyScalar(distance));
            racquet.position.copy(pos);
        });

        // Click - Swat
        window.addEventListener('mousedown', () => {
            // Swing animation
            racquet.rotation.z = -0.5;
            setTimeout(() => racquet.rotation.z = 0, 100);

            // Detect hit
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(bugsGroup.children);
            
            if (intersects.length > 0) {
                const hitBug = intersects[0].object;
                
                // Flash Light VFX
                flashLight.position.copy(hitBug.position);
                flashLight.intensity = 5;
                setTimeout(() => flashLight.intensity = 0, 100);

                playZap();
                bugsGroup.remove(hitBug);
                score++;
                scoreUI.innerText = score;
            }
        });

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 5. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Wiggle bugs
            bugsGroup.children.forEach(bug => {
                bug.position.x += Math.sin(Date.now() * 0.005 * bug.userData.rx) * 0.05;
                bug.position.y += Math.cos(Date.now() * 0.005 * bug.userData.ry) * 0.05;
                bug.rotation.x += 0.1;
                bug.rotation.y += 0.1;
            });

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
