<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Mosquito Zapper 3D</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #1a1a2e; 
            cursor: none; 
            user-select: none;
            font-family: Arial, sans-serif;
        }

        #ui {
            position: absolute; 
            top: 20px; 
            left: 20px;
            font-size: 32px; 
            font-weight: bold;
            color: #00f0ff; 
            text-shadow: 0 0 10px #00f0ff, 2px 2px 4px #000; 
            z-index: 100; 
            pointer-events: none;
        }

        /* 2D Overlay Racquet - Guaranteed 1:1 mouse tracking & visual match */
        #racquet-overlay {
            position: absolute;
            width: 180px;
            height: 260px;
            pointer-events: none;
            z-index: 90;
            transform: translate(-50%, -30%);
            transition: transform 0.05s ease-out;
            filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.4));
        }

        .swing {
            transform: translate(-50%, -30%) rotate(-35deg) scale(1.15) !important;
        }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.150.1/build/three.module.js" } }
    </script>
</head>
<body>
    <div id="ui">ZAPS: <span id="score">0</span></div>
    
    <!-- Self-contained Vector Electric Racquet matching your image -->
    <svg id="racquet-overlay" viewBox="0 0 100 150">
        <!-- Handle -->
        <rect x="42" y="85" width="16" height="55" rx="5" fill="#111" />
        <rect x="45" y="90" width="10" height="45" rx="2" fill="#222" />
        <circle cx="50" cy="100" r="2" fill="#00ff00" /> <!-- Power LED -->
        <circle cx="50" cy="110" r="2" fill="#ff0000" />
        
        <!-- Outer Frame -->
        <ellipse cx="50" cy="45" rx="38" ry="42" fill="none" stroke="#00a8ff" stroke-width="6" />
        
        <!-- Inner Electric Mesh Grid -->
        <ellipse cx="50" cy="45" rx="34" ry="38" fill="rgba(0, 240, 255, 0.08)" stroke="#00f0ff" stroke-width="1" />
        <path d="M 20 45 H 80 M 50 10 V 80 M 25 30 H 75 M 25 60 H 75 M 35 15 V 75 M 65 15 V 75" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
        
        <!-- Electric Zap Arc Effect on Net -->
        <path d="M 35 35 L 45 42 L 40 50 L 55 55" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
    </svg>

    <script type="module">
        import * as THREE from 'three';

        // 1. Scene & Camera Setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x1a1a2e, 0.03);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 8;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x101025);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        
        const pointLight = new THREE.PointLight(0x00f0ff, 1, 20);
        scene.add(pointLight);

        // 2. Realistic 3D Mosquito Builder
        function createMosquitoMesh() {
            const bugGroup = new THREE.Group();

            // Materials
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const needleMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
            const wingMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5, side: THREE.DoubleSide });

            // Abdomen (Striped/Pointed)
            const abdomenGeo = new THREE.ConeGeometry(0.12, 0.5, 8);
            const abdomen = new THREE.Mesh(abdomenGeo, bodyMat);
            abdomen.rotation.x = Math.PI / 2.5;
            abdomen.position.set(0, -0.1, -0.2);
            bugGroup.add(abdomen);

            // Thorax (Middle)
            const thoraxGeo = new THREE.SphereGeometry(0.12, 8, 8);
            const thorax = new THREE.Mesh(thoraxGeo, bodyMat);
            bugGroup.add(thorax);

            // Head & Red Eyes
            const headGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const head = new THREE.Mesh(headGeo, bodyMat);
            head.position.set(0, 0.05, 0.12);
            
            const eyeGeo = new THREE.SphereGeometry(0.03, 6, 6);
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(-0.05, 0.07, 0.16);
            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(0.05, 0.07, 0.16);
            
            // Stinger / Proboscis Needle
            const needleGeo = new THREE.CylinderGeometry(0.008, 0.008, 0.3);
            const needle = new THREE.Mesh(needleGeo, needleMat);
            needle.rotation.x = Math.PI / 3;
            needle.position.set(0, -0.05, 0.25);

            bugGroup.add(head, leftEye, rightEye, needle);

            // Wings
            const wingGeo = new THREE.PlaneGeometry(0.4, 0.15);
            const wingLeft = new THREE.Mesh(wingGeo, wingMat);
            wingLeft.position.set(-0.2, 0.1, 0);
            
            const wingRight = new THREE.Mesh(wingGeo, wingMat);
            wingRight.position.set(0.2, 0.1, 0);

            bugGroup.add(wingLeft, wingRight);

            // Scale bug up so it's easy to see and hit
            bugGroup.scale.set(1.8, 1.8, 1.8);
            
            return { mesh: bugGroup, wingLeft, wingRight };
        }

        // 3. Mosquito Spawning & Management
        const bugsGroup = new THREE.Group();
        scene.add(bugsGroup);

        function spawnMosquito() {
            const { mesh, wingLeft, wingRight } = createMosquitoMesh();
            
            mesh.position.set(
                (Math.random() - 0.5) * 10,
                (Math.random() - 0.5) * 6,
                (Math.random() - 0.5) * 3 + 2
            );

            mesh.userData = {
                wingLeft,
                wingRight,
                speedX: (Math.random() - 0.5) * 0.04,
                speedY: (Math.random() - 0.5) * 0.04,
                phase: Math.random() * Math.PI * 2
            };

            bugsGroup.add(mesh);
        }

        for (let i = 0; i < 5; i++) spawnMosquito();
        setInterval(spawnMosquito, 2000);

        // 4. 3D Electric Spark Particle Generator
        function createZapSparks(pos) {
            const particleCount = 25;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const velocities = [];

            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = pos.x;
                positions[i * 3 + 1] = pos.y;
                positions[i * 3 + 2] = pos.z;

                velocities.push(
                    (Math.random() - 0.5) * 0.3,
                    (Math.random() - 0.5) * 0.3,
                    (Math.random() - 0.5) * 0.3
                );
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({ color: 0x00ffff, size: 0.15, transparent: true });
            const pSystem = new THREE.Points(geometry, material);
            scene.add(pSystem);

            let frame = 0;
            function animateParticles() {
                frame++;
                const pArr = pSystem.geometry.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    pArr[i * 3] += velocities[i * 3];
                    pArr[i * 3 + 1] += velocities[i * 3 + 1];
                    pArr[i * 3 + 2] += velocities[i * 3 + 2];
                }
                pSystem.geometry.attributes.position.needsUpdate = true;
                material.opacity -= 0.05;

                if (frame < 20) {
                    requestAnimationFrame(animateParticles);
                } else {
                    scene.remove(pSystem);
                }
            }
            animateParticles();
        }

        // 5. Sound & Interaction
        let audioCtx;
        function playZapSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.12);

            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        const racquetOverlay = document.getElementById('racquet-overlay');
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let score = 0;
        const scoreUI = document.getElementById('score');

        // Track cursor
        window.addEventListener('mousemove', (e) => {
            racquetOverlay.style.left = e.clientX + 'px';
            racquetOverlay.style.top = e.clientY + 'px';

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            
            pointLight.position.x = mouse.x * 5;
            pointLight.position.y = mouse.y * 3;
        });

        // Click to Swat
        window.addEventListener('mousedown', (e) => {
            racquetOverlay.classList.add('swing');
            setTimeout(() => racquetOverlay.classList.remove('swing'), 100);

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(bugsGroup.children, true);

            if (intersects.length > 0) {
                // Find parent mosquito group
                let obj = intersects[0].object;
                while (obj.parent && obj.parent !== bugsGroup) {
                    obj = obj.parent;
                }

                createZapSparks(obj.position);
                playZapSound();

                bugsGroup.remove(obj);
                score++;
                scoreUI.innerText = score;
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 6. Main Loop
        function animate() {
            requestAnimationFrame(animate);

            // Animate mosquitoes
            const time = Date.now() * 0.003;
            bugsGroup.children.forEach(bug => {
                bug.position.x += Math.sin(time + bug.userData.phase) * 0.02;
                bug.position.y += Math.cos(time * 0.8 + bug.userData.phase) * 0.02;

                // Rapid wing flap
                bug.userData.wingLeft.rotation.y = Math.sin(Date.now() * 0.1) * 0.8;
                bug.userData.wingRight.rotation.y = -Math.sin(Date.now() * 0.1) * 0.8;
            });

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
